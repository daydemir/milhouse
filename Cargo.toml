[package]
name = "milhouse-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mil"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
pulldown-cmark = "0.13.4"
seahash = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
